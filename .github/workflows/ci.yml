name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Bundle-size analysis
        run: |
          echo "Generated bundle files:"
          find dist -type f -printf '%k KB  %p\n' | sort -nr
          echo "Total output: $(du -sh dist | cut -f1)"
